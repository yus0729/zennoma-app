<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050506" />
    <!-- アプリの顔（D85）— タブと予備画面とホーム追加のアイコン。正本は assets/appicon.png -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>ZENnoMA</title>
    <style>
      /* スプラッシュ（D123）— JSを読み込むあいだ、白い画面を出さない。
         この時点ではまだ外観の設定を読めない（applyAppearance は main.tsx の中で動く）ので、
         端末の明暗にだけ従う。明るいときは paper、暗いときは sumi の地
         （既定の外観は「端末に合わせる」で、暗い端末では sumi が選ばれる — settings.ts）。
         消すのは main.tsx（React が最初の描画を終えたあと） */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f4ee;
        transition: opacity 0.4s ease-out;
      }
      @media (prefers-color-scheme: dark) {
        #splash {
          background: #050506; /* sumi/dark の --bg。theme-color とも同じ値 */
        }
      }
      #splash img {
        width: 120px;
        height: 120px;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-6xgFISqo.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-nHSz0z4F.css">
  </head>
  <body>
    <div id="splash">
      <!-- 円相は縮小版（240px・十数KB）。原画の2048pxは重く、遅い回線では
           JSのほうが先に着いて、スプラッシュが無地のまま消えていた（D124） -->
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="/enso-splash-ink.png" />
        <img src="/enso-splash-paper.png" alt="" />
      </picture>
    </div>
    <div id="root"></div>
  </body>
</html>
